openapi: 3.0.3
info:
  title: Modern-DHCP API
  version: 1.0.0
  description: |
    Section 15.1 baseline for Modern-DHCP REST API. This document enumerates the
    public control-plane endpoints exposed under /api/v1 and describes security
    requirements for API keys and OAuth2/JWT bearer tokens.
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: manager.example.com
security:
  - ApiKeyAuth: []
  - OAuth2: [dhcp.read]
tags:
  - name: Auth
    description: Authentication, sessions, and API keys
  - name: Tenants
    description: Multi-tenant scoped operations
  - name: Monitoring
    description: Telemetry and health endpoints
  - name: Operations
    description: Event timelines and operator activity feeds
  - name: Automation
    description: Scheduler diagnostics and automation workflows
  - name: Policies
    description: Policy authoring interfaces
  - name: OpsSupport
    description: Ops & Support metadata and directories
paths:
  /auth/session:
    post:
      summary: Create a console session
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '200':
          description: Session granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Invalid credentials
    delete:
      summary: Destroy current session
      tags: [Auth]
      responses:
        '204':
          description: Session revoked
  /auth/session/refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRefreshRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Refresh token invalid
  /auth/api-keys:
    get:
      summary: List API keys for current principal
      tags: [Auth]
      responses:
        '200':
          description: API key inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
    post:
      summary: Create an API key
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequest'
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
  /auth/api-keys/{keyId}:
    delete:
      summary: Revoke an API key
      tags: [Auth]
      parameters:
        - $ref: '#/components/parameters/KeyID'
      responses:
        '204':
          description: Key revoked
  /tenants:
    get:
      summary: List accessible tenants
      tags: [Tenants]
      responses:
        '200':
          description: Tenant list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantSummary'
  /session/tenant:
    put:
      summary: Set active tenant context
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionContextRequest'
      responses:
        '200':
          description: Updated tenant context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContextResponse'
  /healthz:
    get:
      summary: Control-plane health status
      tags: [Monitoring]
      responses:
        '200':
          description: Health payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /tenants/{tenantId}/pools:
    get:
      summary: List address pools
      tags: [Tenants]
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Pool collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pool'
    post:
      summary: Create pool
      tags: [Tenants]
      security:
        - ApiKeyAuth: []
        - OAuth2: [dhcp.write]
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pool'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pool'
  /tenants/{tenantId}/leases:
    get:
      summary: List active leases
      tags: [Tenants]
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - in: query
          name: state
          schema:
            type: string
      responses:
        '200':
          description: Lease list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lease'
  /tenants/{tenantId}/audit:
    get:
      summary: Retrieve audit log slice
      tags: [Tenants]
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditActions'
        - $ref: '#/components/parameters/AuditResource'
        - $ref: '#/components/parameters/AuditCorrelationId'
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
  /tenants/{tenantId}/quotas:
    get:
      summary: Retrieve tenant quota limits
      tags: [Tenants]
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Tenant quota snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantQuota'
    put:
      summary: Update tenant quota limits
      tags: [Tenants]
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantQuotaUpdateRequest'
      responses:
        '200':
          description: Updated tenant quota snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantQuota'
        '400':
          description: Invalid quota payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tenants/{tenantId}/reports/monthly-usage:
    get:
      summary: Monthly usage report
      tags: [Tenants]
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Usage report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyUsageReport'
  /monitoring/overview:
    get:
      summary: Tenant monitoring overview snapshot
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/TenantQuery'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Combined pool, request, system, and security insight
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewSnapshot'
  /monitoring/pools:
    get:
      summary: Pool utilization snapshot
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/TenantQuery'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Current utilization for monitored pools
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringPoolsResponse'
  /monitoring/requests:
    get:
      summary: DHCP lifecycle request metrics
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/TenantQuery'
      responses:
        '200':
          description: Latency and error-rate observations per DHCP phase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringRequestsResponse'
  /monitoring/health:
    get:
      summary: Runtime system health snapshot
      tags: [Monitoring]
      responses:
        '200':
          description: Host metrics with optional HA status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringHealthResponse'
  /monitoring/security:
    get:
      summary: Guard and snooping telemetry
      tags: [Monitoring, Security]
      parameters:
        - $ref: '#/components/parameters/TenantQuery'
      responses:
        '200':
          description: Rate-limit and snooping windows for the tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringSecurityResponse'
  /monitoring/system-health:
    get:
      summary: Cluster and dependency health snapshot
      tags: [Monitoring]
      responses:
        '200':
          description: System health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthSnapshot'
  /monitoring/events/timeline:
    get:
      summary: Unified operational event stream
      tags: [Monitoring, Operations]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Timeline entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
  /monitoring/operations:
    get:
      summary: Recent operator activities
      tags: [Operations]
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Operation log snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationLogSnapshot'
  /monitoring/alerts:
    get:
      summary: Alert lifecycle feed for the active tenant
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/TenantQuery'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Alert feed snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertFeedSnapshot'
  /monitoring/alerts/feed:
    get:
      summary: Alert lifecycle feed (alias)
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/TenantQuery'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Alert feed snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertFeedSnapshot'
  /monitoring/alerts/rules:
    get:
      summary: Compiled alert rule catalog
      tags: [Monitoring]
      responses:
        '200':
          description: Alert rule descriptors evaluated by the controller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertRuleDescriptor'
  /monitoring/alerts/{alertId}/ack:
    post:
      summary: Acknowledge an alert and optionally assign ownership
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/AlertID'
        - $ref: '#/components/parameters/TenantQuery'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertAcknowledgeRequest'
      responses:
        '200':
          description: Updated alert entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertFeedEntry'
        '404':
          description: Alert not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /monitoring/alerts/{alertId}/suppress:
    post:
      summary: Suppress an alert for a duration or channel
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/AlertID'
        - $ref: '#/components/parameters/TenantQuery'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertSuppressRequest'
      responses:
        '200':
          description: Suppressed alert entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertFeedEntry'
        '404':
          description: Alert not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /monitoring/analytics:
    get:
      summary: Advanced analytics snapshot for dashboards
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/TenantQuery'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Capacity and anomaly insights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSnapshot'
  /monitoring/integrations/cmdb:
    get:
      summary: CMDB-friendly payload containing hotspots and alert totals
      tags: [Monitoring]
      parameters:
        - $ref: '#/components/parameters/TenantQuery'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Payload suitable for CMDB/ITSM ingestion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CMDBSyncPayload'
  /automation/snapshot:
    get:
      summary: Automation scheduler snapshot
      tags: [Automation]
      responses:
        '200':
          description: Scheduler metrics and runtime info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationSnapshot'
  /automation/schedules:
    get:
      summary: List configured automation schedules
      tags: [Automation]
      responses:
        '200':
          description: Enabled recurring jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AutomationSchedule'
  /automation/jobs:
    get:
      summary: List automation job history
      tags: [Automation]
      parameters:
        - $ref: '#/components/parameters/TenantQuery'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - in: query
          name: types
          schema:
            type: string
          description: Comma separated JobType filters
        - in: query
          name: statuses
          schema:
            type: string
          description: Comma separated status filters (pending,running,succeeded,failed)
        - in: query
          name: sources
          schema:
            type: string
          description: Comma separated job source identifiers
        - in: query
          name: triggeredBy
          schema:
            type: string
          description: Filter by triggering principal
      responses:
        '200':
          description: Automation job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationJobListResponse'
    post:
      summary: Enqueue an ad-hoc automation job
      tags: [Automation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationJobRequest'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationJobResponse'
        '400':
          description: Invalid job payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /automation/jobs/{jobId}:
    get:
      summary: Retrieve automation job details
      tags: [Automation]
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/TenantQuery'
      responses:
        '200':
          description: Automation job detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationJobRun'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ops/system:
    get:
      summary: System management summary
      tags: [OpsSupport]
      responses:
        '200':
          description: Current maintenance window and export/import switches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsSystemSummary'
    put:
      summary: Update platform theme, locale, and maintenance metadata
      tags: [OpsSupport]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsSystemUpdate'
      responses:
        '200':
          description: Updated system summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsSystemSummary'
  /ops/settings/theme:
    patch:
      summary: Update default control-plane theme
      tags: [OpsSupport]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [theme]
              properties:
                theme:
                  type: string
      responses:
        '200':
          description: Updated system summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsSystemSummary'
  /ops/settings/locale:
    patch:
      summary: Update default locale
      tags: [OpsSupport]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale:
                  type: string
      responses:
        '200':
          description: Updated system summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsSystemSummary'
  /ops/settings/maintenance:
    patch:
      summary: Update maintenance mode, window, or announcement
      tags: [OpsSupport]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maintenanceMode:
                  type: boolean
                maintenanceWindow:
                  type: string
                announcement:
                  type: string
      responses:
        '200':
          description: Updated system summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsSystemSummary'
  /ops/import-export:
    get:
      summary: Import/export channel overview
      tags: [OpsSupport]
      responses:
        '200':
          description: Storage path, formats, and latest transfers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportExportSummary'
  /ops/import-export/jobs:
    post:
      summary: Submit an import/export job
      tags: [OpsSupport]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferJobRequest'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferJob'
    get:
      summary: List import/export jobs
      tags: [OpsSupport]
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Recent import/export jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferJobListResponse'
  /ops/import-export/jobs/{jobId}:
    get:
      summary: Get an import/export job
      tags: [OpsSupport]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferJob'
  /ops/help-center:
    get:
      summary: Help center metadata
      tags: [OpsSupport]
      responses:
        '200':
          description: Cached article index and featured topics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpCenterInfo'
  /ops/help-center/articles:
    get:
      summary: List help center articles
      tags: [OpsSupport]
      responses:
        '200':
          description: Article catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpArticleList'
  /ops/help-center/faq:
    get:
      summary: List frequently asked questions
      tags: [OpsSupport]
      responses:
        '200':
          description: FAQ entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpFAQList'
  /ops/help-center/releases:
    get:
      summary: List release notes
      tags: [OpsSupport]
      responses:
        '200':
          description: Release notes timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseNoteList'
  /ops/support:
    get:
      summary: Support directory
      tags: [OpsSupport]
      responses:
        '200':
          description: Ticketing, chat, and escalation contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportDirectory'
  /ops/scripts:
    get:
      summary: Script runner catalog
      tags: [OpsSupport]
      responses:
        '200':
          description: Script whitelist and default runner settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptCatalog'
  /ops/scripts/{scriptName}/runs:
    post:
      summary: Start an approved script run
      tags: [OpsSupport]
      parameters:
        - name: scriptName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptRunRequest'
      responses:
        '202':
          description: Script run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptRun'
  /ops/scripts/runs:
    get:
      summary: Recent script runs
      tags: [OpsSupport]
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Script run history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptRunListResponse'
  /ops/scripts/runs/{runId}:
    get:
      summary: Get a specific script run
      tags: [OpsSupport]
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Script run details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptRun'
  /ops/scripts/runs/{runId}/approve:
    post:
      summary: Approve a pending script run
      tags: [OpsSupport]
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptApprovalRequest'
      responses:
        '200':
          description: Script run approved and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptRun'
  /ops/scripts/runs/{runId}/reject:
    post:
      summary: Reject a pending script run
      tags: [OpsSupport]
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptApprovalRequest'
      responses:
        '200':
          description: Script run rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptRun'
  /diagnostics/snapshot:
    get:
      summary: Diagnostics snapshot
      tags: [Diagnostics]
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - name: format
          in: query
          schema:
            type: string
            enum: [json, zip]
      responses:
        '200':
          description: JSON snapshot or downloadable ZIP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsSnapshot'
            application/zip:
              schema:
                type: string
                format: binary
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/oauth/token
          scopes:
            dhcp.read: Read-only access
            dhcp.write: Write access
  parameters:
    TenantID:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
    TenantQuery:
      name: tenantId
      in: query
      required: false
      schema:
        type: string
      description: Optional tenant override when using an admin/API key context.
    AlertID:
      name: alertId
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier returned by the alert feed.
    KeyID:
      name: keyId
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
    Cursor:
