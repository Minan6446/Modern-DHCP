openapi: 3.0.3
info:
  title: Modern-DHCP Monitoring & Pools Extract
  description: |
    Focused OpenAPI bundle covering the metadata-aware pool endpoints plus the Phase 8 monitoring
    surfaces (alert lifecycle, analytics, CMDB sync, system health, operations timeline).
    Point SDK generators at this file when downstream tooling only needs these integration slices.
  version: 0.3.0
servers:
  - url: https://example.com
    description: Replace with your management API base URL
paths:
  /api/v1/tenants/{tenantId}/pools/find:
    post:
      summary: Filter pools by metadata
      tags:
        - Pools
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PoolFindRequest'
      responses:
        '200':
          description: Matching pools ordered from least to most specific
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressPool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tenants/{tenantId}/pools/resolve:
    post:
      summary: Resolve the most specific pool for relay metadata
      tags:
        - Pools
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PoolSelector'
      responses:
        '200':
          description: Pool matched by interface/SSID/location/VLAN priority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressPool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No matching pool for the supplied selector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/monitoring/analytics:
    get:
      summary: Advanced analytics snapshot (capacity + anomalies)
      tags:
        - Monitoring
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Analytics snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/monitoring/alerts:
    get:
      summary: Alert lifecycle feed
      tags:
        - Monitoring
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Alert feed snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertFeedSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/monitoring/alerts/{alertId}/ack:
    post:
      summary: Acknowledge an alert
      tags:
        - Monitoring
      parameters:
        - $ref: '#/components/parameters/AlertIdPath'
        - $ref: '#/components/parameters/TenantIdQuery'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertAcknowledgeRequest'
      responses:
        '200':
          description: Updated alert entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertFeedEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/BadRequest'
  /api/v1/monitoring/alerts/{alertId}/suppress:
    post:
      summary: Suppress an alert
      tags:
        - Monitoring
      parameters:
        - $ref: '#/components/parameters/AlertIdPath'
        - $ref: '#/components/parameters/TenantIdQuery'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertSuppressRequest'
      responses:
        '200':
          description: Updated alert entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertFeedEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/BadRequest'
  /api/v1/monitoring/integrations/cmdb:
    get:
      summary: CMDB/ITSM sync payload
      tags:
        - Monitoring
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: CMDB sync payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CMDBSyncPayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/monitoring/system-health:
    get:
      summary: Cluster and dependency health snapshot
      tags:
        - Monitoring
      responses:
        '200':
          description: System health snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/monitoring/events/timeline:
    get:
      summary: Unified operational event stream
      tags:
        - Monitoring
        - Operations
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Timeline entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/monitoring/operations:
    get:
      summary: Recent operator activities
      tags:
        - Operations
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Operation log snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationLogSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  parameters:
    TenantIdPath:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
      description: Tenant identifier
    TenantIdQuery:
      name: tenantId
      in: query
      required: false
      schema:
        type: string
      description: Optional tenant override when using privileged credentials.
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
      description: Maximum number of records to return.
    CursorQuery:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Cursor returned by the previous timeline request.
    AlertIdPath:
      name: alertId
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier returned by the alert feed.
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    PoolFindRequest:
      type: object
      properties:
        scope:
          type: string
          description: Optional scope restriction (GLOBAL/SUBNET/VLAN/PORT)
        parentId:
          type: string
        vlanId:
          type: integer
          minimum: 1
        interfaceId:
          type: string
        ssid:
          type: string
        location:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      additionalProperties: false
    PoolSelector:
      type: object
      description: Metadata collected from relay or AP context
      properties:
        interfaceId:
          type: string
        ssid:
          type: string
        location:
          type: string
        vlanId:
          type: integer
          minimum: 1
      minProperties: 1
      additionalProperties: false
    AddressPool:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        scope:
          type: string
        parentId:
          type: string
          nullable: true
        name:
          type: string
        cidr:
          type: string
          description: CIDR notation for the pool
        network:
          type: string
        netmask:
          type: string
        rangeStart:
          type: string
        rangeEnd:
          type: string
        vlanId:
          type: integer
          nullable: true
        interfaceId:
          type: string
          nullable: true
        ssid:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        reservePercent:
          type: integer
        leaseProfileId:
          type: string
        tags:
          type: string
          format: byte
        exclusions:
          type: array
          items:
            $ref: '#/components/schemas/IPRange'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - tenantId
        - scope
        - name
        - cidr
        - rangeStart
        - rangeEnd
        - leaseProfileId
        - createdAt
        - updatedAt
    IPRange:
      type: object
      properties:
        start:
          type: string
        end:
          type: string
      required:
        - start
        - end
    Error:
      type: object
      properties:
        message:
          type: string
        errorCode:
          type: string
      required:
        - message
    PolicyAction:
      type: object
      description: Action payload evaluated by the policy engine.
      properties:
        poolId:
          type: string
          format: uuid
        poolSelector:
          $ref: '#/components/schemas/PoolSelector'
        leaseProfile:
          $ref: '#/components/schemas/LeaseProfileOverride'
      anyOf:
        - required:
            - poolId
        - required:
            - poolSelector
    LeaseProfileOverride:
      type: object
      properties:
        defaultDuration:
          type: integer
          minimum: 60
        minDuration:
          type: integer
          minimum: 60
        maxDuration:
          type: integer
          minimum: 60
        notificationLead:
          type: integer
          minimum: 0
      additionalProperties: false
    AlertFeedEntry:
      type: object
      properties:
        id:
          type: string
        summary:
          type: string
        details:
          type: string
        category:
          type: string
        severity:
          type: string
        lifecycle:
          type: string
          enum:
            - open
            - acknowledged
            - suppressed
        source:
          type: string
        tenantId:
          type: string
        assignee:
          type: string
        channel:
          type: string
        fingerprint:
          type: string
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AlertFeedTotals:
      type: object
      properties:
        open:
          type: integer
        acknowledged:
          type: integer
        suppressed:
          type: integer
    AlertFeedSnapshot:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        totals:
          $ref: '#/components/schemas/AlertFeedTotals'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/AlertFeedEntry'
    AlertAcknowledgeRequest:
      type: object
      properties:
        assignee:
          type: string
        ttlSeconds:
          type: integer
          format: int64
    AlertSuppressRequest:
      type: object
      properties:
        channel:
          type: string
        ttlSeconds:
          type: integer
          format: int64
    PoolUsageSummary:
      type: object
      properties:
        poolId:
          type: string
        name:
          type: string
        scope:
          type: string
        vlanId:
          type: integer
        location:
          type: string
        allocated:
          type: integer
        capacity:
          type: integer
        utilization:
          type: number
    CapacityInsight:
      type: object
      properties:
        poolId:
          type: string
        name:
          type: string
        utilization:
          type: number
        headroom:
          type: integer
        projectedExhaustion:
          type: string
          format: date-time
        recommendation:
          type: string
    AnomalyInsight:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        metric:
          type: string
        severity:
          type: string
        current:
          type: number
        baseline:
          type: number
        summary:
          type: string
        detectedAt:
          type: string
          format: date-time
    AnalyticsSnapshot:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        capacity:
          type: array
          items:
            $ref: '#/components/schemas/CapacityInsight'
        anomalies:
          type: array
          items:
            $ref: '#/components/schemas/AnomalyInsight'
    CMDBSyncPayload:
      type: object
      properties:
        tenantId:
          type: string
        source:
          type: string
        generatedAt:
          type: string
          format: date-time
        poolHotspots:
          type: array
          items:
            $ref: '#/components/schemas/PoolUsageSummary'
        capacityInsights:
          type: array
          items:
            $ref: '#/components/schemas/CapacityInsight'
        anomalyInsights:
          type: array
          items:
            $ref: '#/components/schemas/AnomalyInsight'
        alertTotals:
          $ref: '#/components/schemas/AlertFeedTotals'
    SystemHealthSnapshot:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
        cluster:
          $ref: '#/components/schemas/ClusterStatus'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheck'
    ClusterStatus:
      type: object
      properties:
        role:
          type: string
        nodes:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    HealthCheck:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        details:
          type: string
        latencyMs:
          type: integer
    TimelineResponse:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        nextCursor:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventTimelineItem'
    EventTimelineItem:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        severity:
          type: string
        summary:
          type: string
        source:
          type: string
        occurredAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
    OperationLogSnapshot:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/OperationLogEntry'
    OperationLogEntry:
      type: object
      properties:
        id:
          type: string
        actor:
          type: string
        action:
          type: string
        resource:
          type: string
        scope:
          type: string
        status:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
